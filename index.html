<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cladue 聊天</title>
<meta name="theme-color" content="#4f6bed">
<meta name="description" content="端對端加密、資料只存在本機的文字聊天室">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root {
  --bg: #f4f5f8; --panel: #ffffff; --panel2: #f0f2f7; --line: #e2e5ec;
  --text: #1d2130; --muted: #6b7285; --accent: #4f6bed; --accent-ink: #ffffff;
  --mine: #4f6bed; --mine-ink: #ffffff; --theirs: #ffffff; --theirs-ink: #1d2130;
  --ok: #1fa36a; --warn: #d9822b; --danger: #d64545;
  --shadow: 0 6px 24px rgba(20, 30, 60, .14);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12141b; --panel: #1a1d27; --panel2: #232735; --line: #2c3142;
    --text: #e6e8ef; --muted: #9097ab; --accent: #6d84ff; --accent-ink: #ffffff;
    --mine: #4f6bed; --mine-ink: #ffffff; --theirs: #262a38; --theirs-ink: #e6e8ef;
    --shadow: 0 6px 24px rgba(0, 0, 0, .5);
  }
}
:root[data-theme="dark"] {
  --bg: #12141b; --panel: #1a1d27; --panel2: #232735; --line: #2c3142;
  --text: #e6e8ef; --muted: #9097ab; --accent: #6d84ff; --accent-ink: #ffffff;
  --mine: #4f6bed; --mine-ink: #ffffff; --theirs: #262a38; --theirs-ink: #e6e8ef;
  --shadow: 0 6px 24px rgba(0, 0, 0, .5);
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg); color: var(--text);
  font: 15px/1.45 system-ui, -apple-system, "Segoe UI", "Microsoft JhengHei", "PingFang TC", sans-serif;
  overflow: hidden;
}
button { font: inherit; color: inherit; cursor: pointer; }
input, textarea { font: inherit; color: var(--text); }
.app { display: grid; grid-template-columns: 330px 1fr; height: 100dvh; }
/* sidebar */
.side { background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
.side-top { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--line); padding-top: calc(12px + env(safe-area-inset-top)); }
.me-btn { display: flex; align-items: center; gap: 10px; background: none; border: 0; padding: 0; min-width: 0; flex: 1; text-align: left; }
.me-btn .who { min-width: 0; }
.me-btn .nm { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.me-btn .cd { font-size: 12px; color: var(--muted); font-family: ui-monospace, Consolas, monospace; }
.status { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; white-space: nowrap; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--warn); }
.dot.on { background: var(--ok); }
.side-actions { display: flex; gap: 8px; padding: 10px 14px; }
.side-actions button { flex: 1; }
.list { flex: 1; overflow-y: auto; padding-bottom: env(safe-area-inset-bottom); }
.sec { font-size: 12px; color: var(--muted); padding: 12px 16px 4px; font-weight: 600; letter-spacing: .04em; }
.item { display: flex; align-items: center; gap: 10px; padding: 9px 14px; cursor: pointer; border-left: 3px solid transparent; }
.item:hover { background: var(--panel2); }
.item.active { background: var(--panel2); border-left-color: var(--accent); }
.item .mid { flex: 1; min-width: 0; }
.item .t { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.item .p { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.item .r { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; font-size: 11px; color: var(--muted); }
.badge { background: var(--danger); color: #fff; border-radius: 10px; font-size: 11px; padding: 0 6px; min-width: 18px; text-align: center; line-height: 18px; }
.badge.muted { background: var(--muted); }
.item.unread .t { font-weight: 700; }
.item.unread .p { color: var(--text); }
.ntf-bar { display: flex; align-items: center; gap: 8px; margin: 10px 14px 4px; padding: 9px 10px 9px 12px; background: var(--panel2); border: 1px solid var(--line); border-radius: 12px; font-size: 13px; }
.ntf-bar .mid { flex: 1; min-width: 0; }
.ntf-bar .icon-btn { font-size: 16px; padding: 2px 6px; color: var(--muted); }
.req { padding: 10px 14px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 10px; }
.req .mid { flex: 1; min-width: 0; }
.empty { color: var(--muted); font-size: 13px; padding: 8px 16px; }
.av { width: 40px; height: 40px; border-radius: 50%; flex: none; display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 16px; }
.av.room { border-radius: 12px; }
.av.sm { width: 34px; height: 34px; font-size: 14px; }
/* buttons */
.btn { border: 1px solid var(--line); background: var(--panel2); border-radius: 10px; padding: 8px 12px; }
.btn:hover { filter: brightness(.97); }
.btn.pri { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.danger { color: var(--danger); }
.btn.sm { padding: 4px 10px; font-size: 13px; border-radius: 8px; }
.btn:disabled { opacity: .5; cursor: default; }
.icon-btn { background: none; border: 0; padding: 6px 8px; border-radius: 8px; font-size: 18px; line-height: 1; }
.icon-btn:hover { background: var(--panel2); }
/* chat */
.main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.chat-head { display: flex; align-items: center; gap: 10px; padding: 10px 12px; background: var(--panel); border-bottom: 1px solid var(--line); padding-top: calc(10px + env(safe-area-inset-top)); }
.chat-head .mid { flex: 1; min-width: 0; }
.chat-head .t { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chat-head .s { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.back { display: none; white-space: nowrap; }
.back .badge { display: inline-block; margin-left: 2px; vertical-align: middle; }
.msgs { flex: 1; overflow-y: auto; padding: 14px 14px 8px; display: flex; flex-direction: column; gap: 4px; }
.day { align-self: center; font-size: 12px; color: var(--muted); background: var(--panel2); border-radius: 10px; padding: 2px 10px; margin: 10px 0 4px; }
.unread-line { display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--accent); margin: 10px 0 4px; }
.unread-line::before, .unread-line::after { content: ''; flex: 1; border-top: 1px solid var(--accent); opacity: .5; }
.sys { align-self: center; font-size: 12px; color: var(--muted); margin: 4px 0; text-align: center; }
.m { display: flex; flex-direction: column; max-width: min(78%, 560px); align-self: flex-start; }
.m.mine { align-self: flex-end; align-items: flex-end; }
.m .who { font-size: 12px; color: var(--muted); margin: 6px 4px 2px; }
.m .row { display: flex; align-items: flex-end; gap: 6px; }
.m.mine .row { flex-direction: row-reverse; }
.bub { background: var(--theirs); color: var(--theirs-ink); border-radius: 16px; padding: 7px 12px; white-space: pre-wrap; word-break: break-word; box-shadow: 0 1px 1px rgba(0,0,0,.06); border: 1px solid var(--line); }
.m.mine .bub { background: var(--mine); color: var(--mine-ink); border-color: transparent; }
.bub a { color: inherit; }
.meta { font-size: 11px; color: var(--muted); white-space: nowrap; }
.card { align-self: center; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; margin: 6px 0; max-width: 340px; width: 100%; }
.card .t { font-weight: 600; margin-bottom: 4px; }
.card .s { font-size: 13px; color: var(--muted); margin-bottom: 10px; }
.notice { margin: auto; text-align: center; color: var(--muted); max-width: 360px; padding: 20px; }
.notice .big { font-size: 40px; margin-bottom: 8px; }
.composer { display: flex; gap: 8px; align-items: flex-end; padding: 10px 12px; background: var(--panel); border-top: 1px solid var(--line); padding-bottom: calc(10px + env(safe-area-inset-bottom)); }
.composer textarea { flex: 1; resize: none; border: 1px solid var(--line); background: var(--panel2); border-radius: 12px; padding: 9px 12px; max-height: 140px; min-height: 40px; outline: none; }
.composer textarea:focus { border-color: var(--accent); }
.welcome { margin: auto; text-align: center; color: var(--muted); padding: 24px; max-width: 420px; }
.welcome h2 { color: var(--text); margin: 8px 0; }
/* modal */
.modal-bg { position: fixed; inset: 0; background: rgba(10, 14, 30, .45); display: grid; place-items: center; z-index: 50; padding: 16px; }
.modal { background: var(--panel); border-radius: 16px; box-shadow: var(--shadow); width: 100%; max-width: 440px; max-height: calc(100dvh - 32px); overflow-y: auto; padding: 18px; }
.modal h3 { margin: 0 0 12px; font-size: 17px; }
.modal label { display: block; font-size: 13px; color: var(--muted); margin: 10px 0 4px; }
.modal input[type=text], .modal input[type=password], .modal textarea { width: 100%; border: 1px solid var(--line); background: var(--panel2); border-radius: 10px; padding: 9px 11px; outline: none; }
.modal input:focus, .modal textarea:focus { border-color: var(--accent); }
.modal .hint { font-size: 12px; color: var(--muted); margin-top: 6px; }
.modal .acts { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; flex-wrap: wrap; }
.modal hr { border: 0; border-top: 1px solid var(--line); margin: 16px 0; }
.code-big { font-family: ui-monospace, Consolas, monospace; font-size: 22px; font-weight: 700; letter-spacing: .06em; text-align: center; margin: 4px 0; user-select: all; }
.qr { background: #fff; border-radius: 12px; padding: 8px; width: 210px; margin: 8px auto; }
.qr svg { display: block; width: 100%; height: auto; }
.pick { display: flex; align-items: center; gap: 10px; padding: 6px 4px; border-radius: 8px; cursor: pointer; }
.pick:hover { background: var(--panel2); }
.pick input { width: 18px; height: 18px; }
.tabs { display: flex; gap: 6px; margin-bottom: 10px; }
.tabs button { flex: 1; }
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: #222838; color: #fff; padding: 9px 16px; border-radius: 12px; font-size: 14px; z-index: 60; box-shadow: var(--shadow); max-width: calc(100vw - 32px); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.toast.click { cursor: pointer; }
.toast.click::after { content: '  ›'; opacity: .7; }
.hidden { display: none !important; }
@media (max-width: 760px) {
  .app { grid-template-columns: 1fr; }
  .main { display: none; }
  body.chat-open .side { display: none; }
  body.chat-open .main { display: flex; }
  .back { display: inline-block; }
  .m { max-width: 86%; }
}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="side-top">
      <button class="me-btn" id="meBtn" title="我的資料">
        <div class="av" id="meAv">?</div>
        <div class="who"><div class="nm" id="meName">—</div><div class="cd" id="meCode">—</div></div>
      </button>
      <div class="status"><span class="dot" id="netDot"></span><span id="netText">連線中…</span></div>
    </div>
    <div class="side-actions">
      <button class="btn pri" id="newRoomBtn">＋ 聊天室</button>
      <button class="btn" id="addFriendBtn">＋ 好友</button>
    </div>
    <div class="list" id="list"></div>
  </aside>
  <main class="main" id="main">
    <div class="welcome">
      <div style="font-size:48px">💬</div>
      <h2>Cladue 聊天</h2>
      <p>建立或加入聊天室、加好友開始聊天。<br>訊息端對端加密，只存在你自己的裝置上。</p>
    </div>
  </main>
</div>
<script src="lib/mqtt.min.js"></script>
<script src="lib/qrcode.js"></script>
<script src="app.js"></script>
</body>
</html>
